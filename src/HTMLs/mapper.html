<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XeLauncher — Configuration</title>
<link rel="stylesheet" href="../CSSs/common.css">
<link rel="stylesheet" href="../CSSs/mapper.css">
<style>
  .hold-panel {
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(14px, 2.5vh, 22px); position: relative; z-index: 1;
  }
  .hold-label {
    font-family: var(--font-mono); font-size: clamp(11px, 1.3vw, 14px);
    color: var(--text); letter-spacing: 2px; text-align: center; line-height: 1.6;
  }
  .hold-device {
    font-family: var(--font-mono); font-size: clamp(9px, 0.95vw, 11px);
    color: var(--blue); letter-spacing: 2px; text-align: center;
    min-height: 1.4em; max-width: 70vw; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .hold-bar-wrap {
    width: clamp(200px, 36vw, 420px); height: 4px;
    background: rgba(255,255,255,0.07); overflow: hidden;
  }
  .hold-bar { height: 100%; width: 0%; background: var(--blue); }
  .hold-confirm {
    font-family: var(--font-mono); font-size: clamp(9px, 0.95vw, 11px);
    color: var(--text-hint); letter-spacing: 2px; text-align: center; min-height: 1.2em;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="vignette"></div>
<div class="toast" id="toast"></div>

<div class="mapper-screen">
  <div class="mapper-title" id="mapperTitle">Configuration du périphérique</div>
  <div class="mapper-device" id="mapperDevice"></div>

  <!-- Phase 1 : détection de l'appareil -->
  <div class="hold-panel" id="holdPanel" style="display:none">
    <div class="hold-label" id="holdLabel">
      Appuyez sur un bouton du périphérique<br>que vous souhaitez configurer
    </div>
    <div class="hold-bar-wrap"><div class="hold-bar" id="holdBar"></div></div>
    <div class="hold-device" id="holdDevice"></div>
    <div class="hold-confirm" id="holdConfirm"></div>
  </div>

  <!-- Phase 2 : mapping des touches -->
  <div class="grace-bar-wrap" id="graceBarWrap" style="display:none">
    <div class="grace-bar" id="graceBar"></div>
  </div>
  <div class="mapper-actions" id="mapperActions" style="display:none">Prêt dans…</div>
  <div class="mapper-grid" id="mapperGrid" style="display:none"></div>
  <div class="mapper-hint" id="mapperHint" style="display:none">
    Appuyez sur le bouton correspondant à chaque action
  </div>
  <button class="btn" id="skipBtn" style="display:none">Utiliser les valeurs par défaut</button>
</div>

<script src="../JSs/input.js"></script>
<script src="../JSs/pages/mapper.js"></script>
</body>
</html>
