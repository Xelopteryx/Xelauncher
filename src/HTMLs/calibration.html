<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>XeLauncher — Taille du texte</title>
  <link rel="stylesheet" href="../CSSs/common.css">
  <link rel="stylesheet" href="../CSSs/calibration.css">
</head>
<body>

<div class="grid-bg"></div>
<div class="vignette"></div>

<div class="calib-screen" id="calibScreen">

  <div class="calib-header">
    <div class="calib-title">Taille du texte</div>
    <div class="calib-subtitle">Ajustez la taille pour une lecture confortable à distance</div>
  </div>

  <div class="calib-preview" id="calibPreview">
    <div class="preview-title" id="previewTitle">XeLauncher</div>
    <div class="preview-body" id="previewBody">
      Texte principal — lisible à 3 mètres ?
    </div>
    <div class="preview-hint" id="previewHint">
      INDICATIONS · BOUTONS · LABELS
    </div>
  </div>

  <div class="text-scale-ctrl" id="textScaleCtrl">
    <div class="text-scale-label">TAILLE DU TEXTE</div>
    <div class="text-scale-track">
      <div class="text-scale-fill" id="textScaleFill"></div>
      <div class="text-scale-thumb" id="textScaleThumb"></div>
    </div>
    <div class="text-scale-value" id="textScaleValue">100%</div>
  </div>

  <div class="calib-actions">
    <button class="btn" id="btnReset">Réinitialiser</button>
    <button class="btn active" id="btnConfirm">Confirmer</button>
  </div>

  <div class="hint">←→ ajuster · ✕ confirmer · ○ retour</div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="../JSs/input.js"></script>
<script src="../JSs/pages/calibration.js"></script>
<script>
  window.addEventListener('load', () =>
    requestAnimationFrame(() =>
      requestAnimationFrame(() => window.xeLauncher.rendererReady())
    )
  )
</script>
</body>
</html>
