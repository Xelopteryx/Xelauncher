<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XeLauncher — Touches Jellyfin</title>
<link rel="stylesheet" href="../CSSs/common.css">
<link rel="stylesheet" href="../CSSs/mapper.css">
<style>
.mapper-title { color: var(--blue); }
.mapper-title::after { background: rgba(0,164,220,0.3); }
.jmp-subtitle { font-family: var(--font-mono); font-size: clamp(8px, 0.9vw, 10px); color: var(--text-hint); letter-spacing: 3px; text-transform: uppercase; text-align: center; position: relative; z-index: 1; }
.jmp-choose-panel { display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 2.5vh, 26px); position: relative; z-index: 1; }
.jmp-choose-label { font-family: var(--font-mono); font-size: clamp(11px, 1.3vw, 14px); color: var(--text); letter-spacing: 2px; text-align: center; }
.jmp-count-row { display: flex; gap: clamp(8px, 1.2vw, 16px); }
.jmp-count-btn { width: clamp(40px, 5vw, 60px); height: clamp(40px, 5vw, 60px); background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-mono); font-size: clamp(14px, 1.8vw, 20px); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
.jmp-count-btn.active, .jmp-count-btn.jmp-focused { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }
.jmp-count-btn.jmp-selected { border-color: var(--blue); color: #fff; background: rgba(0,164,220,0.22); }
.jmp-action-info { font-family: var(--font-mono); font-size: clamp(9px, 0.95vw, 11px); color: var(--text-hint); letter-spacing: 2px; text-align: center; max-width: clamp(260px, 50vw, 580px); line-height: 1.5; }
.mapper-btn.always-on { border-color: var(--border); color: var(--text-dim); background: rgba(255,255,255,0.03); }
.mapper-btn.always-on.assigned { border-color: rgba(0,164,220,0.25); color: rgba(0,164,220,0.45); background: rgba(0,164,220,0.04); }
.mapper-grid.jmp-grid { grid-template-columns: repeat(2, 1fr); width: clamp(280px, 58vw, 680px); }
.jmp-steps { display: flex; gap: clamp(6px, 1vw, 12px); position: relative; z-index: 1; }
.jmp-step { width: clamp(22px, 2.5vw, 30px); height: 3px; background: rgba(255,255,255,0.08); transition: background 0.2s; }
.jmp-step.done { background: rgba(0,164,220,0.5); }
.jmp-step.current { background: var(--blue); }
.jmp-hold-panel { display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 2.5vh, 22px); position: relative; z-index: 1; }
.jmp-hold-label { font-family: var(--font-mono); font-size: clamp(11px, 1.3vw, 14px); color: var(--text); letter-spacing: 2px; text-align: center; line-height: 1.6; }
.jmp-hold-device { font-family: var(--font-mono); font-size: clamp(9px, 0.95vw, 11px); color: var(--blue); letter-spacing: 2px; text-align: center; min-height: 1.4em; }
.jmp-hold-bar-wrap { width: clamp(200px, 36vw, 420px); height: 4px; background: rgba(255,255,255,0.07); overflow: hidden; }
.jmp-hold-bar { height: 100%; width: 0%; background: var(--blue); }
.jmp-hold-confirm { font-family: var(--font-mono); font-size: clamp(9px, 0.95vw, 11px); color: var(--text-hint); letter-spacing: 2px; text-align: center; min-height: 1.2em; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="vignette"></div>
<div class="toast" id="toast"></div>

<div class="mapper-screen" id="mapperScreen">
  <div class="mapper-title" id="mapperTitle">Touches Jellyfin</div>
  <div class="jmp-subtitle">Configurez les boutons de votre télécommande pour Jellyfin</div>

  <div class="jmp-steps" id="jmpSteps"></div>

  <div class="grace-bar-wrap" id="graceWrap" style="display:none">
    <div class="grace-bar" id="graceBar"></div>
  </div>

  <div class="mapper-actions" id="mapperActions" style="display:none">Prêt…</div>

  <div class="jmp-hold-panel" id="holdPanel">
    <div class="jmp-hold-label" id="holdLabel">Appuyez sur un bouton du périphérique<br>que vous souhaitez configurer</div>
    <div class="jmp-hold-bar-wrap"><div class="jmp-hold-bar" id="holdBar"></div></div>
    <div class="jmp-hold-device" id="holdDevice"></div>
    <div class="jmp-hold-confirm" id="holdConfirm"></div>
  </div>

  <div class="jmp-choose-panel" id="choosePanel" style="display:none">
    <div class="jmp-choose-label">Combien de boutons supplémentaires<br>possède votre télécommande&nbsp;?</div>
    <div class="jmp-count-row" id="countRow"></div>
    <div class="jmp-action-info" id="countInfo"></div>
    <button class="btn" id="chooseConfirm">Confirmer</button>
  </div>

  <div class="mapper-grid jmp-grid" id="mapperGrid" style="display:none"></div>

  <div class="mapper-hint" id="mapperHint">↑↓←→ naviguer · Entrée confirmer</div>
  <button class="btn" id="skipBtn" style="display:none">Utiliser les valeurs par défaut</button>
</div>

<script src="../JSs/input.js"></script>
<script src="../JSs/pages/jmpmapper.js"></script>
</body>
</html>
