<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>XeLauncher — Profils</title>
  <link rel="stylesheet" href="../CSSs/common.css">
  <link rel="stylesheet" href="../CSSs/profiles.css">
</head>
<body>

<div class="grid-bg"></div>
<div class="vignette"></div>

<!-- ── Écran principal ── -->
<div class="profiles-screen" id="profilesScreen">

  <button class="back-btn" id="backBtn">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Retour
  </button>

  <!-- Vue : saisie serveur -->
  <div class="server-setup" id="serverSetup" style="display:none">
    <div class="server-setup-label">Adresse du serveur Jellyfin</div>
    <div class="server-input-wrap">
      <div class="server-input active" id="serverInput">|</div>
      <div class="server-ping-icon" id="serverPingIcon"></div>
    </div>
    <div class="hint">✕ saisir · ○ retour</div>
  </div>

  <!-- Vue : grille des profils -->
  <div id="profilesView" style="display:none">
    <div class="profiles-header">
      <div style="font-size:32px">🎬</div>
      <div class="header-title">Qui regarde ?</div>
    </div>
    <div class="profiles-grid" id="profilesGrid"></div>
    <div class="hint" style="margin-top:8px">✕ connecter · △ configurer · ○ retour</div>
    <button class="server-btn" id="serverBtn" style="margin-top:8px">
      Serveur : <span class="ip" id="serverBtnIp">—</span>
    </button>
  </div>

</div>

<!-- ── Éditeur de profil ── -->
<div class="editor-overlay" id="editorOverlay">
  <div class="editor-title" id="editorTitle">Profil</div>
  <img class="editor-avatar-preview" id="editorAvatarPreview" src="" alt="">
  <div class="editor-fields">
    <div class="editor-field">
      <span class="label">Nom affiché</span>
      <div class="editor-input" id="eName"></div>
    </div>
    <div class="editor-field">
      <span class="label">Utilisateur Jellyfin</span>
      <div class="editor-input" id="eUser"></div>
    </div>
    <div class="editor-field">
      <span class="label">Mot de passe</span>
      <div class="editor-input" id="ePass"></div>
    </div>
  </div>
  <div class="editor-actions">
    <button class="btn" id="eBtnAvatar">Avatar</button>
    <button class="btn" id="eBtnSave">Sauvegarder</button>
    <button class="btn danger" id="eBtnDelete" style="display:none">Supprimer</button>
    <button class="btn" id="eBtnCancel">Annuler</button>
  </div>
  <div class="hint">↑↓ champ · ←→ bouton · ✕ valider · ○ annuler</div>
</div>

<!-- ── Sélecteur d'avatar ── -->
<div class="avatar-picker" id="avatarPicker">
  <div class="avatar-picker-title">Choisir un avatar</div>
  <div class="avatar-grid" id="avatarGrid"></div>
  <div class="hint">↑↓←→ naviguer · ✕ choisir · ○ annuler</div>
</div>

<!-- ── Clavier virtuel ── -->
<div class="kb-overlay" id="kbOverlay">
  <div class="kb-label" id="kbLabel">Saisie</div>
  <div class="kb-display" id="kbDisplay">|</div>
  <div class="kb-panel">
    <div class="kb-modes">
      <button class="kb-mode-btn on" id="kbModeLetters">A-Z</button>
      <button class="kb-mode-btn"   id="kbModeNums">0-9</button>
      <button class="kb-mode-btn"   id="kbModeSpecials">!@#</button>
    </div>
    <div id="kbRows"></div>
  </div>
</div>

<!-- ── Loading ── -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Connexion…</div>
</div>

<!-- ── Input mapper ── -->
<div class="mapper-overlay" id="mapperOverlay"></div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script src="../JSs/input.js"></script>
<script src="../JSs/pages/profiles.js"></script>
</body>
</html>
